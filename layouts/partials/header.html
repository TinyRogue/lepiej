<header>
  <nav class="main-nav" role="navigation" aria-label="Main navigation">
    <div class="nav-left">
      <a href="{{ if .IsHome }}#about{{ else }}/#about{{ end }}" class="pill" {{ if .IsHome }} aria-current="page" {{
        end }}>O mnie</a>
      <a href="{{ if .IsHome }}#services{{ else }}/#services{{ end }}" class="pill">Oferta</a>
    </div>
    <a href="{{ "/" | relURL }}" class="logo" aria-label="Home">
      <img src="{{ "/assets/utility/logo.svg" | relURL }}" alt="Lepiej. logo" width="120" height="32" />
    </a>
    <div class="nav-right">
      <a href="{{ if .IsHome }}#portfolio{{ else }}/#portfolio{{ end }}" class="pill">Portfolio</a>
      <a href="{{ if .IsHome }}#contact{{ else }}/#contact{{ end }}" class="pill">Kontakt</a>
    </div>
    <button class="hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobile-nav">
      <span class="line"></span>
      <span class="line"></span>
      <span class="line"></span>
    </button>
  </nav>
</header>
<div class="fullscreen-overlay">
  <nav class="mobile-nav" id="mobile-nav" role="navigation" aria-label="Mobile navigation">
    <a href="{{ if .IsHome }}#{{ else }}/#{{ end }}">Początek</a>
    <a href="{{ if .IsHome }}#about{{ else }}/#about{{ end }}">O mnie</a>
    <a href="{{ if .IsHome }}#services{{ else }}/#services{{ end }}">Oferta</a>
    <a href="{{ if .IsHome }}#portfolio{{ else }}/#portfolio{{ end }}">Portfolio</a>
    <a href="{{ if .IsHome }}#contact{{ else }}/#contact{{ end }}">Kontakt</a>
    <div class="dot"></div>
  </nav>
</div>

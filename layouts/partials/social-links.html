<div class="social-section">
  <div class="social-links">
    <a href="https://www.instagram.com/lepiej.social/" target="_blank" rel="noopener noreferrer"
      class="social-link instagram" aria-label="Instagram">
      <img src="{{ "/assets/utility/ig-black.svg" | relURL }}" alt="Instagram" width="16" height="16">
    </a>
    <a href="https://www.tiktok.com/@lepiej.socialmedia" target="_blank" rel="noopener noreferrer"
      class="social-link tiktok" aria-label="TikTok">
      <img src="{{ "/assets/utility/tiktok.svg" | relURL }}" alt="TikTok" width="16" height="16">
    </a>
    {{ with .Site.Params.whatsapp.number }}
    <a href="https://wa.me/{{ . }}" target="_blank" rel="noopener noreferrer"
      class="social-link whatsapp" aria-label="WhatsApp">
      <img src="{{ "/assets/utility/whatsapp.svg" | relURL }}" alt="WhatsApp" width="16" height="16">
    </a>
    {{ end }}
  </div>
</div>

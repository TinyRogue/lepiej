baseURL = "https://lepiej.social"
locale = "pl-PL"
title = "Lepiej."
publishDir = "public"
buildDrafts = false
buildFuture = false
enableRobotsTXT = true
enableGitInfo = false

[permalinks]
about-me = "/about-me/"
ugc = "/ugc/"
social-media = "/social-media/"
graphic-designs = "/graphic-designs/"


[params]
description = "Lepiej. is a company that helps brands grow through social media. We create UGC, illustrations, design, branding, marketing, and audits."
keywords = "Lepiej, social media, UGC, illustrations, design, branding, marketing, audit"
author = "Lepiej Team"
themeColor = "#9E0031"
coming_soon = false                                                                                                                                      # set to false to show the full site

[sitemap]
changefreq = "monthly"
priority = 0.5
filename = "sitemap.xml"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

# Allow intentionally authored HTML content files under /content
# (blocked by default since Hugo v0.162.0 for XSS mitigation)
[security]
allowContent = ['.*']

[caches]
[caches.images]
dir = ':cacheDir/images'
